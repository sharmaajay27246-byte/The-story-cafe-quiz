<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Story Cafe - Host Panel</title>
  <style>
    body { background: #121212; color: #fff; font-family: Arial, sans-serif; text-align: center; padding: 50px; }
    .card { background: #1e1e1e; padding: 30px; border-radius: 10px; display: inline-block; width: 450px; }
    .btn { display: block; width: 100%; padding: 12px; margin: 10px 0; background: #ffc107; color: #000; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; }
    .btn-red { background: #dc3545; color: #fff; }
    .btn:hover { opacity: 0.9; }
    #login-screen { display: block; }
    #admin-screen { display: none; }
  </style>
</head>
<body>
  <!-- Login Screen -->
  <div id="login-screen" class="card">
    <h2>Host Login</h2>
    <p style="color: #aaa; font-size: 14px;">Bina password ke seedha login karein!</p>
    <button class="btn" onclick="loginHost()">Login Karein</button>
  </div>

  <!-- Admin Control Screen -->
  <div id="admin-screen" class="card">
    <h2 id="q-num">Sawal 1 / 10</h2>
    <p id="question">Loading...</p>
    <p id="answer-status" style="color: #28a745; font-weight: bold;">Jawab de chuke hain: 0 / 0</p>
    
    <button class="btn" onclick="revealAnswer()">Jawab Dekhein (Reveal)</button>
    <button class="btn" onclick="nextQuestion()">Agla Sawal (Next)</button>
    <button class="btn btn-red" onclick="resetGame()">Game Reset Karein</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    function loginHost() {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('admin-screen').style.display = 'inline-block';
    }

    socket.on('question-update', (data) => {
      document.getElementById('q-num').innerText = `Sawal ${data.index} / ${data.total}`;
      document.getElementById('question').innerText = data.question;
      document.getElementById('answer-status').innerText = `Jawab de chuke hain: 0 / 1`;
    });

    socket.on('answer-count', (count) => {
      document.getElementById('answer-status').innerText = `Jawab de chuke hain: ${count} / 1`;
    });

    socket.on('reveal-answer', (correctIdx) => {
      alert("Sahi jawab reveal kar diya gaya hai!");
    });

    function revealAnswer() {
      socket.emit('reveal-answer');
    }

    function nextQuestion() {
      socket.emit('next-question');
    }

    function resetGame() {
      socket.emit('reset-game');
    }
  </script>
</body>
</html>
