<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Story Cafe - Host Dashboard</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #121212; color: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }

    /* Splash Screen Animation */
    #splash-screen {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #0d0d0d;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      animation: fadeOut 0.8s ease 2.2s forwards;
    }
    .splash-logo {
      font-size: 2.8rem;
      font-weight: bold;
      color: #ffaa00;
      text-transform: uppercase;
      letter-spacing: 2px;
      animation: zoomIn 1.5s ease forwards;
      text-align: center;
      padding: 0 20px;
    }
    .splash-sub {
      font-size: 1.1rem;
      color: #aaaaaa;
      margin-top: 10px;
      opacity: 0;
      animation: fadeInText 1s ease 0.8s forwards;
    }

    @keyframes zoomIn {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes fadeInText {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeOut {
      0% { opacity: 1; visibility: visible; }
      100% { opacity: 0; visibility: hidden; }
    }

    .container { background: #1e1e1e; padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); width: 90%; max-width: 500px; text-align: center; }
    h1 { color: #ffaa00; margin-bottom: 20px; font-size: 24px; }
    input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #444; background: #2a2a2a; color: #fff; border-radius: 6px; font-size: 16px; outline: none; }
    button { width: 100%; padding: 12px; background: #ffaa00; border: none; color: #121212; font-weight: bold; font-size: 16px; border-radius: 6px; cursor: pointer; transition: 0.2s; margin-top: 10px; }
    button:hover { background: #e69500; }
    .hidden { display: none !important; }
    .player-chip { display: inline-block; background: #333; padding: 8px 15px; border-radius: 20px; margin: 5px; font-size: 14px; border: 1px solid #555; }
    .leaderboard-item { display: flex; justify-content: space-between; padding: 8px 12px; background: #2a2a2a; margin-bottom: 5px; border-radius: 4px; }
  </style>
</head>
<body>

  <!-- Splash Screen Animation -->
  <div id="splash-screen">
    <div class="splash-logo">☕ The Story Cafe</div>
    <div class="splash-sub">Host Control Panel</div>
  </div>

  <div class="container">
    <!-- Login Screen -->
    <div id="screen-login">
      <h1>Host Login</h1>
      <input type="password" id="password" placeholder="Password Dalein (admin123)...">
      <button onclick="hostLogin()">Login Karein</button>
    </div>

    <!-- Host Dashboard / Lobby -->
    <div id="screen-dashboard" class="hidden">
      <h1>The Story Cafe - Dashboard</h1>
      <p style="margin-bottom: 15px; color: #aaa;"> Jude hue Players: <span id="player-count" style="color: #ffaa00; font-weight: bold;">0</span></p>
      <div id="players-list" style="margin-bottom: 20px; max-height: 150px; overflow-y: auto; text-align: left;"></div>
      <button onclick="startGame()">Game Shuru Karein</button>
    </div>

    <!-- Active Question / Control Screen -->
    <div id="screen-control" class="hidden">
      <h2 id="host-q-num" style="color: #ffaa00; margin-bottom: 10px;"></h2>
      <p id="host-q-text" style="font-size: 18px; margin-bottom: 15px;"></p>
      <p style="margin-bottom: 15px; color: #4caf50;" id="answered-status"></p>
      <button id="next-btn" onclick="nextStep()">Jawab Dekhein / Agla Sawal</button>
      <button style="background: #d32f2f; color: #fff;" onclick="resetGame()">Game Reset Karein</button>
    </div>

    <!-- Finished Screen -->
    <div id="screen-finished" class="hidden">
      <h1>🏆 Winner Leaderboard</h1>
      <div id="leaderboard-container" style="margin: 20px 0; text-align: left;"></div>
      <button onclick="resetGame()">Naya Game Shuru Karein</button>
    </div>
  </div>

  <script>
    const socket = io();

    function hostLogin() {
      const pw = document.getElementById('password').value;
      socket.emit('host:login', pw, (res) => {
        if (res.ok) {
          document.getElementById('screen-login').classList.add('hidden');
          document.getElementById('screen-dashboard').classList.remove('hidden');
        } else {
          alert('Galat Password!');
        }
      });
    }

    function startGame() {
      socket.emit('host:start', (res) => {
        if (!res.ok) {
          alert(res.error);
        }
      });
    }

    function nextStep() {
      socket.emit('host:skip');
    }

    function resetGame() {
      socket.emit('host:reset');
    }

    socket.on('state', (state) => {
      if (state.role === 'host' || document.getElementById('screen-dashboard').classList.contains('hidden') === false || state.phase !== 'lobby') {
        if (state.phase === 'lobby') {
          document.getElementById('screen-dashboard').classList.remove('hidden');
          document.getElementById('screen-control').classList.add('hidden');
          document.getElementById('screen-finished').classList.add('hidden');

          document.getElementById('player-count').innerText = state.playerCount;
          const listDiv = document.getElementById('players-list');
          listDiv.innerHTML = state.names.length === 0 ? '<p style="color: #666; text-align: center;">Abhi koi player nahi juda hai...</p>' : '';
          state.names.forEach(name => {
            const span = document.createElement('span');
            span.className = 'player-chip';
            span.innerText = name;
            listDiv.appendChild(span);
          });
        } else if (state.phase === 'question' || state.phase === 'reveal') {
          document.getElementById('screen-dashboard').classList.add('hidden');
          document.getElementById('screen-finished').classList.add('hidden');
          document.getElementById('screen-control').classList.remove('hidden');

          document.getElementById('host-q-num').innerText = `Sawal ${state.qNum} / ${state.total}`;
          document.getElementById('host-q-text').innerText = state.question.text;
          document.getElementById('answered-status').innerText = `Jawab de chuke hain: ${state.answeredCount} / ${state.playerCount}`;
          
          const btn = document.getElementById('next-btn');
          if (state.phase === 'question') {
            btn.innerText = 'Jawab Dekhein (Reveal)';
          } else {
            btn.innerText = state.qNum < state.total ? 'Agla Sawal Shuru Karein' : 'Winner Dekhein';
          }
        } else if (state.phase === 'finished') {
          document.getElementById('screen-control').classList.add('hidden');
          document.getElementById('screen-finished').classList.remove('hidden');

          const lbDiv = document.getElementById('leaderboard-container');
          lbDiv.innerHTML = '';
          state.leaderboard.forEach(l => {
            const row = document.createElement('div');
            row.className = 'leaderboard-item';
            row.innerHTML = `<span><b>#${l.rank}</b> ${l.name}</span><span><b>${l.score} pts</b></span>`;
            lbDiv.appendChild(row);
          });
        }
      }
    });
  </script>
</body>
</html>
